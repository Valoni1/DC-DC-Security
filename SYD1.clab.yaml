name: SYD1
topology:
    nodes:
        graphite:
            kind: linux
            image: netreplica/graphite:latest
            env:
                HOST_CONNECTION: ${SSH_CONNECTION}
            binds:
                - __clabDir__/topology-data.json:/htdocs/default/default.json:ro
                - __clabDir__/ansible-inventory.yml:/htdocs/lab/default/ansible-inventory.yml:ro
            ports:
                - 8080:80
            exec:
                - sh -c 'graphite_motd.sh 8080'
            labels:
                graph-hide: yes

        syd1-ss1:
            kind: srl
            type: ixrd3l 
            image: ghcr.io/nokia/srlinux:latest
            labels:
                graph-icon: superspine
                graph-level: 10
                role: Superspine
                group: SYD1
                platform: SR-Linux
                vendor: Nokia
                model: 7220 IXR-D3L 32*100GE

        syd1-pd1-sp1:
            kind: srl
            type: ixrd3l 
            image: ghcr.io/nokia/srlinux:latest
