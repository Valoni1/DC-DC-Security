name: DC1-DC2
topology:
    nodes:
        graphite:
            kind: linux
            image: netreplica/graphite:latest
            env:
                HOST_CONNECTION: ${SSH_CONNECTION}
            binds:
                - __clabDir__/topology-data.json:/htdocs/default/default.json:ro
                - __clabDir__/ansible-inventory.yml:/htdocs/lab/default/ansible-inventory.yml:ro
            ports:
                - 8080:80
            exec:
                - sh -c 'graphite_motd.sh 8080'
            labels:
                graph-hide: yes

        syd1-pd1-sp1:
            kind: srl
            type: ixrd3l 
            image: ghcr.io/nokia/srlinux:latest
            memory: 1.5Gb
            labels:
                graph-icon: spine
                graph-level: 10
                role: Spine
                group: DC1
                platform: SR Linux Spine
                vendor: Nokia
                model: 7220 IXR-D3L 32*100GE

        syd1-pd1-l1:
            kind: srl
            type: ixrd3l 
            image: ghcr.io/nokia/srlinux:latest
            memory: 1Gb
            labels:
                graph-icon: leaf
                graph-level: 10
                role: Leaf
                group: DC1
                platform: SR Linux Leaf
                vendor: Nokia
                model: 7220 IXR-D3L 32*100GE

        syd1-pd1-l2:
            kind: srl
            type: ixrd3l 
            image: ghcr.io/nokia/srlinux:latest
