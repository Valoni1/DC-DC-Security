type: platform_map
version: v1
platforms:
  ubuntu:
    kinds:
      clab: linux
  sr-linux:
    kinds:
      clab: srl
  sros:
    kinds:
      clab: sros
  srl-leaf:
    kinds:
      clab: srl-leaf
  srl-spine:
    kinds:
      clab: srl-spine
  srl-superspine:
    kinds:
      clab: srl-superspine
  srl-gateway:
    kinds:
      clab: srl-gateway
kinds:
  clab:
    # SR Linux is pinned to the release the dissertation baseline was verified on
    # (v26.7.2, 12 Oct 2026). Change it deliberately, never by pulling :latest.
    linux:
      nodes:
        template: clab/nodes/default.j2
        image: netreplica/ubuntu-host:latest
        cmd: /start.sh -sS
        exec:
          - bash -c "echo root:root | chpasswd"
      interface_names:
        template: clab/interface_names/default.j2
    srl:
      nodes:
        template: clab/nodes/srl.j2
        image: ghcr.io/nokia/srlinux:26.7.2
        type: ixrh4
      interface_names:
        template: clab/interface_names/srl.j2
    sros:
      nodes:
        template: clab/nodes/sros.j2
        type: sr-1s
      interface_names:
        template: clab/interface_names/sros.j2
    srl-leaf:
      nodes:
        template: clab/nodes/srl.j2
        image: ghcr.io/nokia/srlinux:26.7.2
        type: ixrh4
        memory: 2Gb
      interface_names:
        template: clab/interface_names/srl.j2
    srl-spine:
      nodes:
        template: clab/nodes/srl.j2
        image: ghcr.io/nokia/srlinux:26.7.2
        type: ixrh4
        memory: 2Gb
      interface_names:
        template: clab/interface_names/srl.j2
    srl-superspine:
      nodes:
        template: clab/nodes/srl.j2
        image: ghcr.io/nokia/srlinux:26.7.2
        type: ixrh4
        memory: 2Gb
      interface_names:
        template: clab/interface_names/srl.j2
    srl-gateway:
      nodes:
        template: clab/nodes/srl.j2
        image: ghcr.io/nokia/srlinux:26.7.2
        type: ixrh4
        memory: 2Gb
      interface_names:
        template: clab/interface_names/srl.j2
