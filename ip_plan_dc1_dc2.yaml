# IP plan for every DC1/DC2 node and link.
#
# This file is the single place the lab's addressing is defined.
# assign_ips_dc1_dc2.py makes NetBox match it, and configure.py then renders
# device configs from NetBox. Change an address here and re-run that script.
#
#   Loopbacks (lo0, primary IPv4)   172.20.N.0/24 for DC N
#     dc-gateway .1   spine .11   superspine .21   leaf .101
#   Links inside DC N               /31s from 10.1.N.0/24
#   DCI link (DC1 <-> DC2)          /31 from 10.1.0.0/24
#   Host LANs in DC N               /28s from 172.30.N.0/24, one per host
#     Linux host dcN-h1: 172.30.N.0/28   Windows host dcN-w1: 172.30.N.96/28 (both on dcN-l1)
#     the leaf is the first address, the host the second
#
# November 2026: cut to one DC gateway, one superspine, one spine and one leaf
# per DC (22 routers to 8) and to two hosts per DC (one Linux, one Windows)
# to free memory on the lab host; DVWA removed. Both DCI links stay. The
# addresses that remain are unchanged, so earlier results stay comparable.
#
# Interface names are NetBox names (ethernet-1/N), not containerlab ones (e1-N).

loopbacks:
  dc1-sp1: 172.20.1.11/32
  dc1-l1: 172.20.1.101/32
  dc2-sp1: 172.20.2.11/32
  dc2-l1: 172.20.2.101/32
  dc1-ss1: 172.20.1.21/32
  dc1-dci-r1: 172.20.1.1/32
  dc2-ss1: 172.20.2.21/32
  dc2-dci-r1: 172.20.2.1/32

links:
  # DC1
  - {a: dc1-sp1, a_if: ethernet-1/1, a_ip: 10.1.1.0/31, b: dc1-l1, b_if: ethernet-1/28, b_ip: 10.1.1.1/31}
  # DC2
  - {a: dc2-sp1, a_if: ethernet-1/1, a_ip: 10.1.2.0/31, b: dc2-l1, b_if: ethernet-1/28, b_ip: 10.1.2.1/31}
  # DC1
  - {a: dc1-sp1, a_if: ethernet-1/7, a_ip: 10.1.1.24/31, b: dc1-ss1, b_if: ethernet-1/1, b_ip: 10.1.1.25/31}
  - {a: dc1-ss1, a_if: ethernet-1/3, a_ip: 10.1.1.32/31, b: dc1-dci-r1, b_if: ethernet-1/1, b_ip: 10.1.1.33/31}
  # DC2
  - {a: dc2-sp1, a_if: ethernet-1/7, a_ip: 10.1.2.24/31, b: dc2-ss1, b_if: ethernet-1/1, b_ip: 10.1.2.25/31}
  - {a: dc2-ss1, a_if: ethernet-1/3, a_ip: 10.1.2.32/31, b: dc2-dci-r1, b_if: ethernet-1/1, b_ip: 10.1.2.33/31}
  # DCI: two links between the gateways. ethernet-1/3 is the primary (higher
  # BGP local preference), ethernet-1/4 the backup; BFD runs on both.
  - {a: dc1-dci-r1, a_if: ethernet-1/3, a_ip: 10.1.0.0/31, b: dc2-dci-r1, b_if: ethernet-1/3, b_ip: 10.1.0.1/31}
  - {a: dc1-dci-r1, a_if: ethernet-1/4, a_ip: 10.1.0.2/31, b: dc2-dci-r1, b_if: ethernet-1/4, b_ip: 10.1.0.3/31}

# End hosts, one Linux and one Windows per DC, both on the DC's only leaf:
# dcN-h1 on dcN-l1 ethernet-1/1 and dcN-w1 on ethernet-1/2 (the uplink is
# 1/28), each in its own /28. The leaf is the host's gateway and advertises the /28 into OSPF;
# the DC gateways export their DC's 172.30.N.0/24 over the DCI.
hosts:
  # DC1
  - {name: dc1-h1, os: linux, leaf: dc1-l1, leaf_if: ethernet-1/1, leaf_ip: 172.30.1.1/28, host_if: eth1, host_ip: 172.30.1.2/28}
  - {name: dc1-w1, os: windows, leaf: dc1-l1, leaf_if: ethernet-1/2, leaf_ip: 172.30.1.97/28, host_if: eth1, host_ip: 172.30.1.98/28}
  # DC2
  - {name: dc2-h1, os: linux, leaf: dc2-l1, leaf_if: ethernet-1/1, leaf_ip: 172.30.2.1/28, host_if: eth1, host_ip: 172.30.2.2/28}
  - {name: dc2-w1, os: windows, leaf: dc2-l1, leaf_if: ethernet-1/2, leaf_ip: 172.30.2.97/28, host_if: eth1, host_ip: 172.30.2.98/28}

# External / untrusted segment (clab-only, not in NetBox; the routers are not
# touched). One outside AI attacker (ScopeWeaver) with a single link to the
# exposed host dc1-h1, so it reaches the lab only through that host and then
# pivots inward. Addresses are set by containerlab exec, not by the NetBox
# scripts, so prune/add_hosts/assign_ips ignore this block.
external:
  segment: 198.51.100.0/29
  bridge: clab-ext           # host bridge (docker network) the members share
  gateway: 198.51.100.6      # the bridge's own address; nothing routes through it
  members:
    - {name: attacker,    if: eth1, ip: 198.51.100.1/29, role: vantage}   # clab node (Kali, manual attacker)
    - {name: dc1-h1,      if: eth2, ip: 198.51.100.2/29, role: exposed}   # clab node (exposed host)
    - {name: scopeweaver,          ip: 198.51.100.3/29, role: attacker}   # docker compose, not a clab node
