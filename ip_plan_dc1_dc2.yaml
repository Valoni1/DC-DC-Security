# IP plan for every DC1/DC2 node and link.
#
# This file is the single place the lab's addressing is defined.
# assign_ips_dc1_dc2.py makes NetBox match it, and configure.py then renders
# device configs from NetBox. Change an address here and re-run that script.
#
#   Loopbacks (lo0, primary IPv4)   172.20.N.0/24 for DC N
#     dc-gateway .1   spines .11-.12   superspines .21-.22   leaves .101-.106
#   Links inside DC N               /31s from 10.1.N.0/24
#   DCI link (DC1 <-> DC2)          /31 from 10.1.0.0/24
#
# Interface names are NetBox names (ethernet-1/N), not containerlab ones (e1-N).

loopbacks:
  dc1-sp1: 172.20.1.11/32
  dc1-l1: 172.20.1.101/32
  dc1-l2: 172.20.1.102/32
  dc1-l3: 172.20.1.103/32
  dc1-l4: 172.20.1.104/32
  dc1-l5: 172.20.1.105/32
  dc1-l6: 172.20.1.106/32
  dc1-sp2: 172.20.1.12/32
  dc2-sp1: 172.20.2.11/32
  dc2-l1: 172.20.2.101/32
  dc2-l2: 172.20.2.102/32
  dc2-l3: 172.20.2.103/32
  dc2-l4: 172.20.2.104/32
  dc2-l5: 172.20.2.105/32
  dc2-l6: 172.20.2.106/32
  dc2-sp2: 172.20.2.12/32
  dc1-ss1: 172.20.1.21/32
  dc1-ss2: 172.20.1.22/32
  dc1-dci-r1: 172.20.1.1/32
  dc2-ss1: 172.20.2.21/32
  dc2-ss2: 172.20.2.22/32
  dc2-dci-r1: 172.20.2.1/32

links:
  # DC1
  - {a: dc1-sp1, a_if: ethernet-1/1, a_ip: 10.1.1.0/31, b: dc1-l1, b_if: ethernet-1/28, b_ip: 10.1.1.1/31}
  - {a: dc1-sp1, a_if: ethernet-1/2, a_ip: 10.1.1.2/31, b: dc1-l2, b_if: ethernet-1/28, b_ip: 10.1.1.3/31}
  - {a: dc1-sp1, a_if: ethernet-1/3, a_ip: 10.1.1.4/31, b: dc1-l3, b_if: ethernet-1/28, b_ip: 10.1.1.5/31}
  - {a: dc1-sp1, a_if: ethernet-1/4, a_ip: 10.1.1.6/31, b: dc1-l4, b_if: ethernet-1/28, b_ip: 10.1.1.7/31}
  - {a: dc1-sp1, a_if: ethernet-1/5, a_ip: 10.1.1.8/31, b: dc1-l5, b_if: ethernet-1/28, b_ip: 10.1.1.9/31}
  - {a: dc1-sp1, a_if: ethernet-1/6, a_ip: 10.1.1.10/31, b: dc1-l6, b_if: ethernet-1/28, b_ip: 10.1.1.11/31}
  - {a: dc1-sp2, a_if: ethernet-1/1, a_ip: 10.1.1.12/31, b: dc1-l1, b_if: ethernet-1/27, b_ip: 10.1.1.13/31}
  - {a: dc1-sp2, a_if: ethernet-1/2, a_ip: 10.1.1.14/31, b: dc1-l2, b_if: ethernet-1/27, b_ip: 10.1.1.15/31}
  - {a: dc1-sp2, a_if: ethernet-1/3, a_ip: 10.1.1.16/31, b: dc1-l3, b_if: ethernet-1/27, b_ip: 10.1.1.17/31}
  - {a: dc1-sp2, a_if: ethernet-1/4, a_ip: 10.1.1.18/31, b: dc1-l4, b_if: ethernet-1/27, b_ip: 10.1.1.19/31}
  - {a: dc1-sp2, a_if: ethernet-1/5, a_ip: 10.1.1.20/31, b: dc1-l5, b_if: ethernet-1/27, b_ip: 10.1.1.21/31}
  - {a: dc1-sp2, a_if: ethernet-1/6, a_ip: 10.1.1.22/31, b: dc1-l6, b_if: ethernet-1/27, b_ip: 10.1.1.23/31}
  # DC2
  - {a: dc2-sp1, a_if: ethernet-1/1, a_ip: 10.1.2.0/31, b: dc2-l1, b_if: ethernet-1/28, b_ip: 10.1.2.1/31}
  - {a: dc2-sp1, a_if: ethernet-1/2, a_ip: 10.1.2.2/31, b: dc2-l2, b_if: ethernet-1/28, b_ip: 10.1.2.3/31}
  - {a: dc2-sp1, a_if: ethernet-1/3, a_ip: 10.1.2.4/31, b: dc2-l3, b_if: ethernet-1/28, b_ip: 10.1.2.5/31}
  - {a: dc2-sp1, a_if: ethernet-1/4, a_ip: 10.1.2.6/31, b: dc2-l4, b_if: ethernet-1/28, b_ip: 10.1.2.7/31}
  - {a: dc2-sp1, a_if: ethernet-1/5, a_ip: 10.1.2.8/31, b: dc2-l5, b_if: ethernet-1/28, b_ip: 10.1.2.9/31}
  - {a: dc2-sp1, a_if: ethernet-1/6, a_ip: 10.1.2.10/31, b: dc2-l6, b_if: ethernet-1/28, b_ip: 10.1.2.11/31}
  - {a: dc2-sp2, a_if: ethernet-1/1, a_ip: 10.1.2.12/31, b: dc2-l1, b_if: ethernet-1/27, b_ip: 10.1.2.13/31}
  - {a: dc2-sp2, a_if: ethernet-1/2, a_ip: 10.1.2.14/31, b: dc2-l2, b_if: ethernet-1/27, b_ip: 10.1.2.15/31}
  - {a: dc2-sp2, a_if: ethernet-1/3, a_ip: 10.1.2.16/31, b: dc2-l3, b_if: ethernet-1/27, b_ip: 10.1.2.17/31}
  - {a: dc2-sp2, a_if: ethernet-1/4, a_ip: 10.1.2.18/31, b: dc2-l4, b_if: ethernet-1/27, b_ip: 10.1.2.19/31}
  - {a: dc2-sp2, a_if: ethernet-1/5, a_ip: 10.1.2.20/31, b: dc2-l5, b_if: ethernet-1/27, b_ip: 10.1.2.21/31}
  - {a: dc2-sp2, a_if: ethernet-1/6, a_ip: 10.1.2.22/31, b: dc2-l6, b_if: ethernet-1/27, b_ip: 10.1.2.23/31}
  # DC1
  - {a: dc1-sp1, a_if: ethernet-1/7, a_ip: 10.1.1.24/31, b: dc1-ss1, b_if: ethernet-1/1, b_ip: 10.1.1.25/31}
  - {a: dc1-sp1, a_if: ethernet-1/8, a_ip: 10.1.1.26/31, b: dc1-ss2, b_if: ethernet-1/1, b_ip: 10.1.1.27/31}
  - {a: dc1-sp2, a_if: ethernet-1/7, a_ip: 10.1.1.28/31, b: dc1-ss1, b_if: ethernet-1/2, b_ip: 10.1.1.29/31}
  - {a: dc1-sp2, a_if: ethernet-1/8, a_ip: 10.1.1.30/31, b: dc1-ss2, b_if: ethernet-1/2, b_ip: 10.1.1.31/31}
  - {a: dc1-ss1, a_if: ethernet-1/3, a_ip: 10.1.1.32/31, b: dc1-dci-r1, b_if: ethernet-1/1, b_ip: 10.1.1.33/31}
  - {a: dc1-ss2, a_if: ethernet-1/3, a_ip: 10.1.1.34/31, b: dc1-dci-r1, b_if: ethernet-1/2, b_ip: 10.1.1.35/31}
  # DC2
  - {a: dc2-sp1, a_if: ethernet-1/7, a_ip: 10.1.2.24/31, b: dc2-ss1, b_if: ethernet-1/1, b_ip: 10.1.2.25/31}
  - {a: dc2-sp1, a_if: ethernet-1/8, a_ip: 10.1.2.26/31, b: dc2-ss2, b_if: ethernet-1/1, b_ip: 10.1.2.27/31}
  - {a: dc2-sp2, a_if: ethernet-1/7, a_ip: 10.1.2.28/31, b: dc2-ss1, b_if: ethernet-1/2, b_ip: 10.1.2.29/31}
  - {a: dc2-sp2, a_if: ethernet-1/8, a_ip: 10.1.2.30/31, b: dc2-ss2, b_if: ethernet-1/2, b_ip: 10.1.2.31/31}
  - {a: dc2-ss1, a_if: ethernet-1/3, a_ip: 10.1.2.32/31, b: dc2-dci-r1, b_if: ethernet-1/1, b_ip: 10.1.2.33/31}
  - {a: dc2-ss2, a_if: ethernet-1/3, a_ip: 10.1.2.34/31, b: dc2-dci-r1, b_if: ethernet-1/2, b_ip: 10.1.2.35/31}
  # DCI
  - {a: dc1-dci-r1, a_if: ethernet-1/3, a_ip: 10.1.0.0/31, b: dc2-dci-r1, b_if: ethernet-1/3, b_ip: 10.1.0.1/31}
